[package]
name = "owly-kdeconnect"
description = "Bridges Owly (AWDL + AirDrop) and Apple BLE endpoints (ANCS, AMS/AVRCP, Battery, PBAP/MAP) directly into KDE Connect without requiring the KDE Connect app on the phone."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["kdeconnect", "airdrop", "awdl", "apple", "continuity"]
categories = ["network-programming", "os::linux-apis"]

[lib]
name = "owly_kdeconnect"
path = "src/lib.rs"

[[bin]]
name = "owly-kdeconnectd"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false }
getrandom = "0.3"
nix = { version = "0.31", default-features = false, features = ["fs", "hostname", "net", "signal", "user"] }
owly-airdrop = { path = "../owly-airdrop", features = ["mdns"] }
owly-awdl = { path = "../owly-awdl" }
owly-radio = { path = "../owly-radio" }
owlyd = { path = "../owlyd" }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pem", "pkcs8", "std"] }
rcgen = { version = "0.14", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[lints]
workspace = true
